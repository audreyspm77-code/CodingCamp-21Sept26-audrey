<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="container">
    <header>
      <h1>Expense Visualizer</h1>
      <div class="balance-section">
        <span class="balance-label">Total Balance:</span>
        <span id="balance-amount">0.00</span>
      </div>
    </header>

    <main>
      <section class="form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Expense</h2>
        <form id="expense-form" novalidate>
          <div class="field-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              placeholder="e.g. Coffee"
              maxlength="100"
              autocomplete="off"
            />
            <span class="field-error" data-for="item-name" role="alert" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="item-amount">Amount ($)</label>
            <input
              type="number"
              id="item-amount"
              name="item-amount"
              placeholder="e.g. 4.50"
              min="0.01"
              max="999999999.99"
              step="0.01"
            />
            <span class="field-error" data-for="item-amount" role="alert" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="item-category">Category</label>
            <select id="item-category" name="item-category">
              <option value="">-- Select a category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="field-error" data-for="item-category" role="alert" aria-live="polite"></span>
          </div>

          <div id="storage-error" class="storage-error" role="alert" aria-live="assertive"></div>

          <button type="submit" id="submit-btn">Add Expense</button>
        </form>
      </section>

      <section class="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <div class="chart-container">
          <canvas id="spending-chart" aria-label="Pie chart showing spending by category" role="img"></canvas>
          <p id="chart-unavailable" class="chart-unavailable hidden">
            Chart unavailable — could not load charting library.
          </p>
        </div>
      </section>

      <section class="list-section" aria-labelledby="list-heading">
        <h2 id="list-heading">Transactions</h2>
        <ol id="transaction-list" aria-label="List of recorded transactions">
          <!-- Transactions rendered by app.js -->
        </ol>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
